[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "postgresql-mcp-server"
version = "1.0.0"
description = "A PostgreSQL Model Context Protocol (MCP) Server"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "wuyongan", email = "609674711@qq.com"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.0.0",
    "asyncpg>=0.29.0",
    "uvicorn>=0.29.0",
    "python-dotenv>=1.0.0",
    "starlette>=0.35.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
postgresql-mcp = "http_mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]  

[tool.pytest.ini_options]
testpaths = ["postgresql_mcp/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["postgresql_mcp"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]